# Decap CMS – browser editing for www.instytut.ilawa.pl. Docs: https://decapcms.org/docs/
# Editors sign in through DecapBridge (https://decapbridge.com): e-mail/password or Google/Microsoft,
# no GitHub account needed. Site settings and invitations: DecapBridge dashboard.
# DecapBridge commits to GitHub with the site's access token;
# Vercel deploys every commit in about a minute.
backend:
  name: git-gateway
  repo: yasiupl/instytut.14-200.pl
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/00cae113-8334-4764-977b-53e17a192c8b/pkce
  auth_token_endpoint: /sites/00cae113-8334-4764-977b-53e17a192c8b/token
  gateway_url: https://gateway.decapbridge.com
  # Author name only: the repository is public, so no e-mail ({{author-login}}) in the history.
  commit_messages:
    create: "Nowy wpis: {{slug}} ({{author-name}})"
    update: "Edycja: {{slug}} ({{author-name}})"
    delete: "Usunięcie: {{slug}} ({{author-name}})"
    uploadMedia: "Nowy plik: {{path}} ({{author-name}})"
    deleteMedia: "Usunięcie pliku: {{path}} ({{author-name}})"

# Editor's name, e-mail and avatar from the DecapBridge sign-in
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

site_url: https://www.instytut.ilawa.pl
display_url: https://www.instytut.ilawa.pl
logo_url: /assets/icon.svg
locale: pl

media_folder: src/assets/img
public_folder: /assets/img

# Uploaded raster images become WebP, like the rest of the site.
# Decap resizes to an exact width (it would also enlarge small images), so size is left as is.
media_processing:
  enabled: true
  format: { enabled: true, default: webp }
  quality: 80

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

# Fields shared by all collections
_fields:
  area: &area
    { label: "Obszar", name: area, widget: select, required: false,
      options: [ { label: "Laboratorium (biologia)", value: lab }, { label: "Pracownia politechniczna", value: pracownia } ] }
  date: &date
    { label: "Data", name: date, widget: datetime, time_format: false, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD" }
  summary: &summary
    { label: "Jedno zdanie na listę", name: summary, widget: string, required: false,
      hint: "Pokazuje się na liście wpisów i w podglądzie linku." }
  description: &description
    { label: "Opis dla wyszukiwarek", name: description, widget: text, required: false,
      hint: "Puste = takie samo jak „Jedno zdanie na listę”." }
  image: &image
    { label: "Obrazek (miniatura)", name: image, widget: image, required: false }
  image_alt: &image_alt
    { label: "Opis obrazka (alt)", name: image_alt, widget: string, required: false,
      hint: "Co widać na obrazku. Używany też w podglądzie linku." }
  hero: &hero
    { label: "Pokaż obrazek w nagłówku", name: hero, widget: boolean, required: false, default: false }
  image_caption: &image_caption
    { label: "Podpis obrazka w nagłówku", name: image_caption, widget: string, required: false }
  draft: &draft
    { label: "Szkic", name: draft, widget: boolean, required: false, default: false,
      hint: "Zaznaczone = strona działa tylko z linku: nie ma jej na listach, w kanałach RSS ani w wyszukiwarkach. Odznacz, aby opublikować." }
  redirects: &redirects
    { label: "Stare adresy (przekierowania)", name: redirect_from, widget: list, required: false,
      hint: "Np. /stara-strona. Nie usuwaj – stare linki przestaną działać." }
  ai: &ai
    { label: "Udział AI", name: ai, widget: select, required: false,
      options: [ { label: "Redakcja (korekta, skróty, tłumaczenie)", value: redakcja },
                 { label: "Współpraca (część tekstu z pomocą AI)", value: wspolpraca },
                 { label: "Tekst wygenerowany przez AI", value: generowane } ],
      hint: "Puste = bez AI. Zasady: /polityka-ai/" }
  ai_note: &ai_note
    { label: "Co dokładnie zrobiło AI", name: ai_note, widget: string, required: false,
      hint: "Opcjonalnie, np. „Tłumaczenie na angielski: DeepL, poprawione ręcznie”." }
  body: &body
    { label: "Treść", name: body, widget: markdown,
      hint: "Wideo: {% youtube \"ID\", \"tytuł\" %}. Formularz: {% form \"adres\", \"napis na przycisku\" %}. Fragment z AI: {% ai \"co zrobiło AI\" %}…{% endai %}." }

collections:
  - name: aktualnosci
    label: Aktualności
    label_singular: Wpis
    folder: src/aktualnosci
    extension: md
    format: frontmatter
    create: true
    slug: "{{title}}"
    preview_path: "aktualnosci/{{slug}}/"
    sortable_fields: [ { field: date, default_sort: desc }, title ]
    summary: "{{date}} · {{title}}{{draft | ternary(' (szkic)', '')}}"
    fields:
      - { label: "Tytuł", name: title, widget: string }
      - *draft
      - *date
      - *area
      - *summary
      - *description
      - *image
      - *image_alt
      - *hero
      - *image_caption
      - *redirects
      - *ai
      - *ai_note
      - *body

  - name: projekty
    label: Projekty
    label_singular: Projekt
    folder: src/projekty
    extension: md
    format: frontmatter
    create: true
    slug: "{{title}}"
    preview_path: "projekty/{{slug}}/"
    sortable_fields: [ { field: date, default_sort: desc }, title ]
    summary: "{{date}} · {{title}}{{draft | ternary(' (szkic)', '')}}"
    fields:
      - { label: "Tytuł", name: title, widget: string }
      - *draft
      - *date
      - *area
      - *summary
      - *description
      - *image
      - *image_alt
      - *hero
      - *image_caption
      - { label: "Adres strony", name: permalink, widget: string, required: false,
          hint: "Puste = /projekty/<nazwa-pliku>/. Zmiana adresu psuje linki." }
      - *redirects
      - { label: "Ukryj z listy projektów", name: eleventyExcludeFromCollections, widget: hidden, required: false }
      - { label: "Podstrona", name: unlisted, widget: hidden, required: false }
      - { label: "Język", name: lang, widget: hidden, required: false }
      - *ai
      - *ai_note
      - *body

  - name: strony
    label: Strony
    label_singular: Strona
    folder: src/pages
    extension: md
    format: frontmatter
    create: false
    delete: false
    summary: "{{title}} ({{permalink}})"
    fields:
      - { label: "Tytuł", name: title, widget: string }
      - *description
      - *area
      - *image
      - *image_alt
      - *hero
      - *image_caption
      - { label: "Adres strony", name: permalink, widget: string, hint: "Nie zmieniaj – psuje linki." }
      - { label: "Język", name: lang, widget: select, options: [pl, en], default: pl }
      - *redirects
      - { label: "Data", name: date, widget: string, required: false }
      - { label: "Wstęp (strony z listą)", name: intro, widget: text, required: false }
      - { label: "Zdanie na listę", name: summary, widget: string, required: false }
      - { label: "Szablon", name: layout, widget: hidden, required: false }
      - { label: "Lista", name: listOf, widget: hidden, required: false }
      - { label: "Mapa", name: map, widget: hidden, required: false }
      - { label: "Linki w nowej karcie", name: linksNewTab, widget: hidden, required: false }
      - { label: "Tagi", name: tags, widget: hidden, required: false }
      - *ai
      - *ai_note
      - *body
